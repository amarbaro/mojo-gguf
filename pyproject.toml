[project]
name = "mojo-gguf"
version = "0.2.1"
description = "GGUF tooling in Mojo, byte-identical with llama.cpp's converters, quantizer and gguf-py scripts"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[dependency-groups]
# the pinned gguf-py and llama.cpp's convert scripts are the oracles (tools/, tests/); product code is Mojo
dev = ["numpy>=2.0", "pyyaml>=6.0", "tqdm>=4.66", "requests>=2.32", "tokenizers>=0.21"]

[tool.mojo]
packages = ["ggufx", "hfconv", "st"]  # one conda package carries all three .mojoc files
deps = ["mojo-uregex"]  # pinned for source builds in scripts/deps.sh
