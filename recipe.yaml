# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.2.0

package:
  name: "mojo-gguf"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/ggufx -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/ggufx.mojoc
    - mojo precompile src/hfconv -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/hfconv.mojoc
    - mojo precompile src/st -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/st.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
    - mojo-uregex
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler') }}
    - mojo-uregex

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-gguf
  license: Apache-2.0
  license_file: LICENSE
  summary: GGUF tooling in Mojo, byte-identical with llama.cpp's converters, quantizer and gguf-py scripts
  repository: https://github.com/amarbaro/mojo-gguf

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-gguf
